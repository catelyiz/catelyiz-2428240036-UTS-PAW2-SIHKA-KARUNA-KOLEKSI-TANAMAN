# Use this workspace to collaborate
workspace:
  id: e48b5677-aebd-4f81-bbb4-1c919e27dc8c

# All resources in the `postman/` folder are automatically registered in Local View.
# Point to additional files outside the `postman/` folder to register them individually. Example:
#localResources:
#  collections:
#    - ../tests/E2E Test Collection/
name: Postman sync
on:
  push:
    branches: ["main"]

concurrency:
  group: postman-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postman-sync:
    name: Postman sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Push workspace
        uses: postmanlabs/postman-cli-action@v1
        with:
          api-key: ${{ secrets.POSTMAN_API_KEY }}
          command: postman workspace push --yes
